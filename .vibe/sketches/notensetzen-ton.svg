<svg xmlns="http://www.w3.org/2000/svg" width="360" height="405" viewBox="0 0 360 405"><title>Skizze NotenSetzen Ton</title><rect width="360" height="405" fill="#fafafa"/><text x="16" y="28" font-size="16" font-family="sans-serif" font-weight="bold">Skizze: NotenSetzen (art: ton, Bassschlüssel)</text><text x="16" y="50" font-size="14" font-family="sans-serif">Aufgabe Nr. 3 · Schreibe das kleine d.</text><line x1="16" y1="60" x2="344" y2="60" stroke="#222"/><line x1="16" y1="70" x2="344" y2="70" stroke="#222"/><line x1="16" y1="80" x2="344" y2="80" stroke="#222"/><line x1="16" y1="90" x2="344" y2="90" stroke="#222"/><line x1="16" y1="100" x2="344" y2="100" stroke="#222"/><text x="22" y="92" font-size="44" font-family="sans-serif">𝄢</text><text x="70" y="150" font-size="11" font-family="sans-serif" fill="#555">kleines f (4. Linie, zwischen den Punkten)</text><rect x="160" y="47.5" width="120" height="5" fill="#2b6cb0" fill-opacity="0.05"/><rect x="160" y="52.5" width="120" height="5" fill="#2b6cb0" fill-opacity="0.1"/><rect x="160" y="57.5" width="120" height="5" fill="#2b6cb0" fill-opacity="0.05"/><rect x="160" y="62.5" width="120" height="5" fill="#2b6cb0" fill-opacity="0.1"/><rect x="160" y="67.5" width="120" height="5" fill="#2b6cb0" fill-opacity="0.05"/><rect x="160" y="72.5" width="120" height="5" fill="#2b6cb0" fill-opacity="0.1"/><rect x="160" y="77.5" width="120" height="5" fill="#2b6cb0" fill-opacity="0.05"/><rect x="160" y="82.5" width="120" height="5" fill="#2b6cb0" fill-opacity="0.1"/><rect x="160" y="87.5" width="120" height="5" fill="#2b6cb0" fill-opacity="0.05"/><rect x="160" y="92.5" width="120" height="5" fill="#2b6cb0" fill-opacity="0.1"/><rect x="160" y="97.5" width="120" height="5" fill="#2b6cb0" fill-opacity="0.05"/><rect x="160" y="102.5" width="120" height="5" fill="#2b6cb0" fill-opacity="0.1"/><rect x="160" y="107.5" width="120" height="5" fill="#2b6cb0" fill-opacity="0.05"/><ellipse cx="220" cy="80" rx="7" ry="5" fill="#222" transform="rotate